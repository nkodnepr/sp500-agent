name: Build Windows installer

# Собирает программу для Windows НА НАСТОЯЩЕЙ Windows-машине в облаке
# GitHub — не нужно ничего устанавливать на своём компьютере и не нужна
# Windows под рукой. PyInstaller не умеет кросс-компилировать (собрать
# .exe на Linux/Mac невозможно), поэтому здесь runs-on: windows-latest.
#
# НА ВЫХОДЕ ДВА ФАЙЛА:
#   1. StockAgent-Setup.exe — установщик. Это то, что нужно отдавать
#      человеку без технических навыков: запустил, нажал "Далее",
#      получил ярлык на рабочем столе и в меню Пуск. Прав администратора
#      не требует, удаляется штатно через "Установка и удаление программ".
#   2. StockAgent.exe — портативная версия одним файлом, без установки:
#      скопировал куда угодно и запустил. Запасной вариант.
#
# КАК ЗАПУСТИТЬ:
# 1. Откройте репозиторий на github.com
# 2. Вкладка "Actions" (сверху)
# 3. Слева в списке — "Build Windows installer"
# 4. Кнопка "Run workflow" (справа) → снова "Run workflow" в выпадающем меню
# 5. Подождите 10-20 минут (зелёная точка = идёт сборка, галочка ✅ = готово)
# 6. Откройте этот запуск → внизу страницы раздел "Artifacts" →
#    скачайте StockAgent-Setup-windows.zip
# 7. Распакуйте — внутри StockAgent-Setup.exe, его и передавайте

on:
  workflow_dispatch:  # ручной запуск кнопкой в интерфейсе GitHub

jobs:
  build:
    runs-on: windows-latest

    # Windows-раннер запускает Python с кодировкой консоли (cp1252), из-за
    # чего вывод с кириллицей роняет скрипты с UnicodeEncodeError. В
    # build_exe.py стоит своя защита, но переменная закрывает и вывод
    # сторонних инструментов сборки.
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          # Та же версия, что в runtime.txt и в CI
          python-version: "3.13.15"
          cache: "pip"

      - name: Установить зависимости для сборки
        # requirements-desktop.txt, а не requirements.txt: настольному
        # приложению не нужен python-telegram-bot, и в сборку он всё
        # равно не попадает (см. EXCLUDES в build_exe.py)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt -r requirements-build.txt

      # ---------- Установщик (основной результат) ----------

      - name: Собрать программу папкой (основа установщика)
        run: python build_exe.py --onedir

      - name: Установить Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Собрать установщик
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\StockAgent.iss'

      - name: Проверить, что установщик появился
        run: |
          if (!(Test-Path "dist_installer\StockAgent-Setup.exe")) {
            Write-Error "dist_installer\StockAgent-Setup.exe не найден после сборки"
            exit 1
          }
          $mb = [math]::Round((Get-Item "dist_installer\StockAgent-Setup.exe").Length / 1MB, 1)
          Write-Host "Установщик собран, размер: $mb МБ"

      - name: Опубликовать установщик как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: StockAgent-Setup-windows
          path: dist_installer/StockAgent-Setup.exe
          retention-days: 30

      # ---------- Проверка: программа реально запускается на Windows ----------

      - name: Установить и запустить программу на этой же Windows-машине
        # Сборка сама по себе не доказывает, что программа стартует: до
        # этого шага её ни разу не запускали на настоящей Windows. Здесь
        # установщик отрабатывает в тихом режиме, а установленная
        # программа запускается по-настоящему — ровно то, что получит
        # конечный пользователь. Шаг стоит ПОСЛЕ публикации артефакта,
        # чтобы установщик можно было скачать даже если проверка упадёт.
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "Проверяем на: $($os.Caption) $($os.Version) ($($os.OSArchitecture))"

          $setup = "dist_installer\StockAgent-Setup.exe"
          Write-Host "Устанавливаю в тихом режиме..."
          $installer = Start-Process -FilePath $setup `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($installer.ExitCode -ne 0) {
            Write-Error "Установщик завершился с кодом $($installer.ExitCode)"
            exit 1
          }

          $exe = "$env:LOCALAPPDATA\Programs\StockAgent\StockAgent.exe"
          if (!(Test-Path $exe)) {
            Write-Error "После установки программа не найдена: $exe"
            exit 1
          }
          Write-Host "Установлено: $exe"

          # Лог ошибок запуска пишет app_entry.py — если он появится,
          # значит программа упала и сама сообщила причину
          $log = "$env:LOCALAPPDATA\StockAgent\startup-error.log"
          if (Test-Path $log) { Remove-Item $log -Force }

          Write-Host "Запускаю программу..."
          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 90
          $app.Refresh()

          if (Test-Path $log) {
            Write-Host "--- Программа сообщила об ошибке запуска ---"
            Get-Content $log
            Write-Error "Программа не смогла запуститься"
            exit 1
          }
          if ($app.HasExited) {
            Write-Error "Программа завершилась сама, код возврата: $($app.ExitCode)"
            exit 1
          }

          Write-Host "OK: программа установилась, запустилась и работает."
          Stop-Process -Id $app.Id -Force

      # ---------- Портативная версия (запасной вариант) ----------

      - name: Собрать портативный StockAgent.exe (одним файлом)
        run: python build_exe.py

      - name: Проверить, что портативный файл появился
        run: |
          if (!(Test-Path "dist\StockAgent.exe")) {
            Write-Error "dist\StockAgent.exe не найден после сборки"
            exit 1
          }
          $mb = [math]::Round((Get-Item "dist\StockAgent.exe").Length / 1MB, 1)
          Write-Host "Портативный файл собран, размер: $mb МБ"

      - name: Опубликовать портативный .exe как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: StockAgent-portable-windows
          path: dist/StockAgent.exe
          retention-days: 30
